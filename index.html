  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"28\" font-weight=\"600\" fill=\"#A1A1A6\" font-family=\"Inter\">reported<\u002Ftext>\n        <g data-b=\"4\"><circle cx=\"505\" cy=\"252\" r=\"30\" fill=\"#32D74B\"><\u002Fcircle><text x=\"550\" y=\"262\" font-size=\"26\" font-weight=\"600\" fill=\"#F5F5F7\" font-family=\"Inter\">usable<\u002Ftext><\u002Fg>\n      <\u002Fsvg>\n      <div data-b=\"4\" style=\"text-align:right\">\n        <span class=\"pill g\">12 Sep 2008<\u002Fspan>\n        <div class=\"big acc\" style=\"font-size:92px;margin-top:16px\">&lt; $2 bn<\u002Fdiv>\n        <p class=\"sec\" style=\"margin-top:8px\">easily available, two days later<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: Valukas (2010); Lehman 10-K FY2007; Lehman 8-K (10 Sep 2008)<\u002Fspan><span class=\"pg\">2 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:30 (total 1:00)\">At bankruptcy, Lehman had 639 billion dollars in assets. It was the largest bankruptcy in US history. On the 30th of November 2007, its leverage was 30.7 times. On the 10th of September 2008, Lehman reported a liquidity pool of about 42 billion dollars. Two days later, less than 2 billion was easily available.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide light\" id=\"s3\">\n  <div class=\"jpm jp\"><b>〇三<\u002Fb>出典<\u002Fdiv>\n  <div class=\"eyebrow\">Sources <span class=\"dt\">· 2008 – 2018<\u002Fspan><\u002Fdiv>\n  <h2>Official findings first. Books last.<\u002Fh2>\n  <div class=\"body\" style=\"display:grid;grid-template-columns:1fr 1.15fr 1fr 1fr;gap:20px;margin-top:34px;align-items:stretch\">\n    <div data-b=\"1\" class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;padding:30px 30px\">\n      <div style=\"display:flex;align-items:center;gap:16px\"><div class=\"ico\" style=\"width:72px;height:72px\"><svg class=\"ic\" width=\"42\" height=\"42\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"><\u002Fcircle><path d=\"M20.5 20.5l-5.2-5.2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"big acc\" style=\"font-size:52px\">1<\u002Fdiv><\u002Fdiv>\n      <h3 style=\"font-size:28px\">Official investigations<\u002Fh3>\n<div><p style=\"font-size:24px\"><b>FCIC Report, ch. 18<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\"><b style=\"color:var(--ink)\">Jan 2011<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>SEC OIG Report 446-A<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\"><b style=\"color:var(--ink)\">25 Sep 2008<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>Valukas, House testimony<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\"><b style=\"color:var(--ink)\">20 Apr 2010<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>Valukas, Senate testimony<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\"><b style=\"color:var(--ink)\">6 Apr 2011<\u002Fb><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-b=\"2\" class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;padding:30px 30px\">\n      <div style=\"display:flex;align-items:center;gap:16px\"><div class=\"ico\" style=\"width:72px;height:72px\"><svg class=\"ic\" width=\"42\" height=\"42\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9.5h18\"><\u002Fpath><path d=\"M12 3l9 5H3z\"><\u002Fpath><path d=\"M5.5 10v8M10 10v8M14 10v8M18.5 10v8\"><\u002Fpath><path d=\"M3 21h18\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"big acc\" style=\"font-size:52px\">2<\u002Fdiv><\u002Fdiv>\n      <h3 style=\"font-size:28px\">Court and primary records<\u002Fh3>\n<div><p style=\"font-size:24px\"><b>Valukas examiner's report<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\">SDNY, No. 08-13555 · <b style=\"color:var(--ink)\">11 Mar 2010<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>Lehman 10-K, FY2007<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\">filed <b style=\"color:var(--ink)\">Jan 2008<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>Lehman 8-K<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\"><b style=\"color:var(--ink)\">9 Jun · 10 Sep 2008<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>Fed · SEC press releases<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\"><b style=\"color:var(--ink)\">16 Mar · 21 Sep · 26 Sep 2008<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>NY Attorney General<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\"><b style=\"color:var(--ink)\">15 Apr 2015<\u002Fb><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-b=\"3\" class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;padding:30px 30px\">\n      <div style=\"display:flex;align-items:center;gap:16px\"><div class=\"ico\" style=\"width:72px;height:72px\"><svg class=\"ic\" width=\"42\" height=\"42\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h12v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z\"><\u002Fpath><path d=\"M16 9h4v10a2 2 0 0 1-2 2h-4\"><\u002Fpath><path d=\"M7 9h6M7 13h6M7 17h3\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"big acc\" style=\"font-size:52px\">3<\u002Fdiv><\u002Fdiv>\n      <h3 style=\"font-size:28px\">Journalism and speeches<\u002Fh3>\n<div><p style=\"font-size:24px\"><b>A. R. Sorkin, “At Lehman, Watchdogs Saw It All”<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\">NYT DealBook · <b style=\"color:var(--ink)\">Mar 2010<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>D. Einhorn, Ira Sohn speech<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\">primary record · <b style=\"color:var(--ink)\">21 May 2008<\u002Fb><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-b=\"4\" class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;padding:30px 30px\">\n      <div style=\"display:flex;align-items:center;gap:16px\"><div class=\"ico\" style=\"width:72px;height:72px\"><svg class=\"ic\" width=\"42\" height=\"42\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 6.5C10 5 7 4.5 3.5 4.5v14c3.5 0 6.5.5 8.5 2 2-1.5 5-2 8.5-2v-14C17 4.5 14 5 12 6.5z\"><\u002Fpath><path d=\"M12 6.5v14\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"big acc\" style=\"font-size:52px\">4<\u002Fdiv><\u002Fdiv>\n      <h3 style=\"font-size:28px\">Books and papers<\u002Fh3>\n<div><p style=\"font-size:24px\"><b>L. Ball, <i>The Fed and Lehman Brothers<\u002Fi><\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\">Cambridge UP · <b style=\"color:var(--ink)\">2018<\u002Fb><\u002Fp><\u002Fdiv><div><p style=\"font-size:24px\"><b>L. Ball, NBER WP 22410<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px\"><b style=\"color:var(--ink)\">Jul 2016<\u002Fb><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p data-b=\"5\" style=\"margin-top:22px;display:flex;align-items:center;gap:14px\"><span style=\"color:var(--rl);display:flex\"><svg class=\"ic\" width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M9 9l6 6M15 9l-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Not used as a source of any fact:<\u002Fb> Wikipedia, blogs, AI answers.<\u002Fp>\n  <div class=\"foot\"><span>Full references: Appendix, slide 16<\u002Fspan><span class=\"pg\">3 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:35 (total 1:35)\">Our main source is the report of Anton Valukas, the examiner appointed by the bankruptcy court. It has nine volumes and more than 250 interviews. We also use his testimony to Congress, the Financial Crisis Inquiry Commission and the SEC Inspector General. We use journalism only with named authors, and one book for one contested point. We did not use Wikipedia or AI answers.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide dark\" id=\"s4\">\n  <div class=\"jpm jp\"><b>〇四<\u002Fb>潜伏期<\u002Fdiv>\n  <div class=\"eyebrow\">Stage 1 · Incubation <span class=\"dt\">· 2006 – 1 Dec 2007<\u002Fspan><\u002Fdiv>\n  <h2>The bank grew. So did the limits.<\u002Fh2>\n  <div class=\"body\" style=\"display:flex;flex-direction:column;gap:30px;margin-top:30px\">\n    <div data-b=\"1\" style=\"position:relative;height:250px\">\n      <svg width=\"1680\" height=\"250\" viewBox=\"0 0 1680 250\" aria-label=\"Schematic: risk limit raised after each breach\">\n        <path class=\"draw\" d=\"M0 220 H200 V190 H420 V160 H620 V128 H820 V96 H1040 V64 H1280 V34 H1680\" fill=\"none\" stroke=\"#32D74B\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath>\n        <g fill=\"#F5F5F7\"><circle cx=\"200\" cy=\"220\" r=\"9\"><\u002Fcircle><circle cx=\"420\" cy=\"190\" r=\"9\"><\u002Fcircle><circle cx=\"620\" cy=\"160\" r=\"9\"><\u002Fcircle><circle cx=\"820\" cy=\"128\" r=\"9\"><\u002Fcircle><circle cx=\"1040\" cy=\"96\" r=\"9\"><\u002Fcircle><circle cx=\"1280\" cy=\"64\" r=\"9\"><\u002Fcircle><\u002Fg>\n        <text x=\"0\" y=\"40\" font-size=\"30\" font-weight=\"700\" fill=\"#F5F5F7\" font-family=\"Inter\" letter-spacing=\"-0.5\">Risk limit: breached, then raised<\u002Ftext>\n        <text x=\"0\" y=\"80\" font-size=\"24\" fill=\"#A1A1A6\" font-family=\"Inter\">schematic · each dot is a breach answered by a higher limit<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1\">\n      <div data-b=\"2\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 20h5v-5h5v-5h5V5h3\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"date acc\" style=\"font-size:40px\">2006–2007<\u002Fdiv><p>Limits breached many times, and raised each time<\u002Fp><\u002Fdiv>\n      <div data-b=\"3\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l9-7 9 7\"><\u002Fpath><path d=\"M5.5 9.5V20h13V9.5\"><\u002Fpath><path d=\"M10 20v-5.5h4V20\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"date acc\" style=\"font-size:40px\">29 May 2007<\u002Fdiv><p>Archstone deal with Tishman Speyer, about <b>$22 bn<\u002Fb>, above Lehman's own limits<\u002Fp><\u002Fdiv>\n      <div data-b=\"4\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9 5-9 5-9-5z\"><\u002Fpath><path d=\"M3 13l9 5 9-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"date acc\" style=\"font-size:40px\">30 Nov 2007<\u002Fdiv><p>Leverage <b>30.7x<\u002Fb>, as reported in the 10-K<\u002Fp><\u002Fdiv>\n      <div data-b=\"5\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"7.5\" r=\"3\"><\u002Fcircle><path d=\"M3.5 20c0-3.2 2.4-5.8 5.5-5.8s5.5 2.6 5.5 5.8\"><\u002Fpath><path d=\"M16 9h5M19 7l2 2-2 2\"><\u002Fpath><path d=\"M21 15h-5M18 13l-2 2 2 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"date acc\" style=\"font-size:40px\">1 Dec 2007<\u002Fdiv><p>The CFO becomes head of risk management. The CRO is moved aside.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: Valukas (2010); Lehman 10-K FY2007<\u002Fspan><span class=\"pg\">4 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:35 (total 2:10)\">Incubation came in 2006 and 2007. Lehman broke its own risk limits many times. Each time, it simply raised them. On the 29th of May 2007, together with Tishman Speyer, it agreed to buy the property company Archstone for about 22 billion dollars. This was above its limits. From the 1st of December 2007, the chief financial officer became head of risk management.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide dark\" id=\"s5\">\n  <div class=\"jpm jp\"><b>〇五<\u002Fb>隠蔽<\u002Fdiv>\n  <div class=\"eyebrow\">Hiding · Repo 105 <span class=\"dt\">· Q4 2007 – Q2 2008<\u002Fspan><\u002Fdiv>\n  <h2>A loan, dressed as a sale.<\u002Fh2>\n  <div class=\"body\" style=\"display:grid;grid-template-columns:760px 1fr;gap:40px;margin-top:36px\">\n    <div style=\"display:flex;flex-direction:column;gap:22px\">\n      <div data-b=\"1\" class=\"card\" style=\"display:flex;gap:26px;align-items:center;padding:28px 32px;flex:1\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2.5 7h19v10h-19z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.6\"><\u002Fcircle><path d=\"M6 10v4M18 10v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">1 · Before quarter end<\u002Fp><p>A short-term loan is booked as a sale. The debt leaves the balance sheet.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div data-b=\"2\" class=\"card\" style=\"display:flex;gap:26px;align-items:center;padding:28px 32px;flex:1\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3l18 18\"><\u002Fpath><path d=\"M10.6 5.1C11 5 11.5 5 12 5c6.2 0 10 7 10 7a17 17 0 0 1-3.1 3.8\"><\u002Fpath><path d=\"M6.6 6.6C3.9 8.5 2 12 2 12s3.8 7 10 7c1.6 0 3.1-.4 4.4-1.1\"><\u002Fpath><path d=\"M9.9 9.9a3 3 0 0 0 4.2 4.2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">2 · Quarter end<\u002Fp><p>The report shows less debt and lower leverage.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div data-b=\"3\" class=\"card\" style=\"display:flex;gap:26px;align-items:center;padding:28px 32px;flex:1\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 2.5l3.5 3.5L17 9.5\"><\u002Fpath><path d=\"M3.5 11V9a3 3 0 0 1 3-3h14\"><\u002Fpath><path d=\"M7 21.5L3.5 18 7 14.5\"><\u002Fpath><path d=\"M20.5 13v2a3 3 0 0 1-3 3h-14\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">3 · A few days later<\u002Fp><p>Lehman buys the assets back. The debt returns.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:22px\">\n      <div data-b=\"4\" class=\"card\" style=\"padding:26px 34px\">\n        <p class=\"sec\" style=\"font-size:24px;font-weight:600\">Repo 105 at quarter end, $ bn<\u002Fp>\n        <svg width=\"720\" height=\"300\" viewBox=\"0 0 720 300\" aria-label=\"Repo 105: 38.6, 49.1 and 50.38 billion dollars\"><circle cx=\"125\" cy=\"128\" r=\"91.9\" fill=\"#2C2C2E\"><\u002Fcircle><text x=\"125\" y=\"144\" font-size=\"46\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"middle\" font-weight=\"700\" letter-spacing=\"-1.5\">38.6<\u002Ftext><text x=\"125\" y=\"273\" font-size=\"24\" font-family=\"Inter\" fill=\"#A1A1A6\" text-anchor=\"middle\" font-weight=\"600\">Q4 2007<\u002Ftext><circle cx=\"360\" cy=\"128\" r=\"103.7\" fill=\"#2C2C2E\"><\u002Fcircle><text x=\"360\" y=\"144\" font-size=\"46\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"middle\" font-weight=\"700\" letter-spacing=\"-1.5\">49.1<\u002Ftext><text x=\"360\" y=\"273\" font-size=\"24\" font-family=\"Inter\" fill=\"#A1A1A6\" text-anchor=\"middle\" font-weight=\"600\">Q1 2008<\u002Ftext><circle cx=\"595\" cy=\"128\" r=\"105.0\" fill=\"#32D74B\"><\u002Fcircle><text x=\"595\" y=\"144\" font-size=\"46\" font-family=\"Inter\" fill=\"#04210D\" text-anchor=\"middle\" font-weight=\"700\" letter-spacing=\"-1.5\">50.38<\u002Ftext><text x=\"595\" y=\"273\" font-size=\"24\" font-family=\"Inter\" fill=\"#A1A1A6\" text-anchor=\"middle\" font-weight=\"600\">Q2 2008<\u002Ftext><\u002Fsvg>\n      <\u002Fdiv>\n      <div data-b=\"5\" class=\"card\" style=\"display:flex;align-items:center;gap:30px;padding:22px 34px\">\n        <svg width=\"280\" height=\"176\" viewBox=\"0 0 280 176\" aria-label=\"Gauge: 12.1 reported against about 13.9\"><path d=\"M30.0 150.0 A110 110 0 0 1 250.0 150.0\" fill=\"none\" stroke=\"#2C2C2E\" stroke-width=\"22\" stroke-linecap=\"round\"><\u002Fpath><path class=\"draw\" d=\"M30.0 150.0 A110 110 0 0 1 175.6 45.9\" fill=\"none\" stroke=\"#32D74B\" stroke-width=\"22\" stroke-linecap=\"round\"><\u002Fpath><line x1=\"192.9\" y1=\"74.7\" x2=\"213.6\" y2=\"45.3\" stroke=\"#F5F5F7\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fline><text x=\"140\" y=\"146\" font-size=\"52\" font-family=\"Inter\" fill=\"#32D74B\" text-anchor=\"middle\" font-weight=\"700\" letter-spacing=\"-2\">12.1<\u002Ftext><\u002Fsvg>\n        <div>\n          <p class=\"sec\" style=\"font-size:24px;font-weight:600\">Net leverage · Q2 2008<\u002Fp>\n          <p style=\"font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px\"><span class=\"acc\">12.1<\u002Fspan> reported<\u002Fp>\n          <p style=\"font-size:30px;font-weight:700;letter-spacing:-.02em\">≈13.9 without Repo 105<\u002Fp>\n          <p class=\"sec\" style=\"margin-top:8px\">Lehman's own materiality threshold: 0.1<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Source: Valukas (2010), quoting Lehman's internal reports<\u002Fspan><span class=\"pg\">5 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:35 (total 2:45)\">Then Lehman hid risk with Repo 105. At the end of a quarter, Lehman booked a short-term loan as a sale. The debt left the balance sheet. A few days later, Lehman bought the assets back. The amount grew from 38.6 billion dollars at the end of 2007 to 50.38 billion in the second quarter of 2008. So net leverage looked like 12.1, not about 13.9.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide light\" id=\"s6\">\n  <div class=\"jpm jp\"><b>〇六<\u002Fb>兆候<\u002Fdiv>\n  <div class=\"eyebrow\">Stage 2 · Signals <span class=\"dt\">· 16 Mar – 12 Jun 2008<\u002Fspan><\u002Fdiv>\n  <h2>Five warnings in less than three months.<\u002Fh2>\n  <div class=\"body\" style=\"margin-top:20px\">\n    <div style=\"position:relative;width:1680px;height:690px\"><svg width=\"1680\" height=\"690\" viewBox=\"0 0 1680 690\" style=\"position:absolute;left:0;top:0\" aria-label=\"Timeline March to June 2008\"><line x1=\"40\" y1=\"340\" x2=\"1656\" y2=\"340\" stroke=\"#D2D2D7\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fline><circle cx=\"40\" cy=\"340\" r=\"6\" fill=\"#86868B\"><\u002Fcircle><text x=\"50\" y=\"380\" font-size=\"24\" font-family=\"Inter\" fill=\"#6E6E73\" text-anchor=\"start\" font-weight=\"500\">March<\u002Ftext><circle cx=\"451\" cy=\"340\" r=\"6\" fill=\"#86868B\"><\u002Fcircle><text x=\"461\" y=\"380\" font-size=\"24\" font-family=\"Inter\" fill=\"#6E6E73\" text-anchor=\"start\" font-weight=\"500\">April<\u002Ftext><circle cx=\"849\" cy=\"340\" r=\"6\" fill=\"#86868B\"><\u002Fcircle><text x=\"859\" y=\"380\" font-size=\"24\" font-family=\"Inter\" fill=\"#6E6E73\" text-anchor=\"start\" font-weight=\"500\">May<\u002Ftext><circle cx=\"1259\" cy=\"340\" r=\"6\" fill=\"#86868B\"><\u002Fcircle><text x=\"1269\" y=\"380\" font-size=\"24\" font-family=\"Inter\" fill=\"#6E6E73\" text-anchor=\"start\" font-weight=\"500\">June<\u002Ftext><circle cx=\"239\" cy=\"340\" r=\"10\" fill=\"#1E8A3E\"><\u002Fcircle><circle cx=\"1047\" cy=\"340\" r=\"10\" fill=\"#1E8A3E\"><\u002Fcircle><circle cx=\"1113\" cy=\"340\" r=\"10\" fill=\"#1E8A3E\"><\u002Fcircle><circle cx=\"1365\" cy=\"340\" r=\"10\" fill=\"#1E8A3E\"><\u002Fcircle><circle cx=\"1405\" cy=\"340\" r=\"10\" fill=\"#1E8A3E\"><\u002Fcircle><\u002Fsvg><div data-b=\"1\" style=\"position:absolute;left:207px;top:244px;width:64px;height:64px;border-radius:20px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);color:#1E8A3E;display:flex;align-items:center;justify-content:center\"><svg class=\"ic\" width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9.5h18\"><\u002Fpath><path d=\"M12 3l9 5H3z\"><\u002Fpath><path d=\"M5.5 10v8M10 10v8M14 10v8M18.5 10v8\"><\u002Fpath><path d=\"M3 21h18\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div data-b=\"1\" class=\"card\" style=\"position:absolute;left:207px;top:44px;width:360px;padding:22px 26px;border-radius:26px\"><div class=\"date acc\" style=\"font-size:34px\">16 Mar 2008<\u002Fdiv><p style=\"font-weight:600;margin-top:6px\">Bear Stearns falls<\u002Fp><p class=\"sec\" style=\"font-size:24px\">pressure to cut leverage<\u002Fp><\u002Fdiv><div data-b=\"2\" style=\"position:absolute;left:1015px;top:400px;width:64px;height:64px;border-radius:20px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);color:#1E8A3E;display:flex;align-items:center;justify-content:center\"><svg class=\"ic\" width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 5.5h18v13H3z\"><\u002Fpath><path d=\"M3 6.5l9 7 9-7\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div data-b=\"2\" class=\"card\" style=\"position:absolute;left:719px;top:480px;width:360px;padding:22px 26px;border-radius:26px\"><div class=\"date acc\" style=\"font-size:34px\">16 May 2008<\u002Fdiv><p style=\"font-weight:600;margin-top:6px\">Matthew Lee's letter<\u002Fp><p class=\"sec\" style=\"font-size:24px\">about accounting problems<\u002Fp><\u002Fdiv><div data-b=\"3\" style=\"position:absolute;left:1081px;top:244px;width:64px;height:64px;border-radius:20px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);color:#1E8A3E;display:flex;align-items:center;justify-content:center\"><svg class=\"ic\" width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 10v4h4l8 5V5l-8 5z\"><\u002Fpath><path d=\"M18.5 9a4.5 4.5 0 0 1 0 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div data-b=\"3\" class=\"card\" style=\"position:absolute;left:785px;top:44px;width:360px;padding:22px 26px;border-radius:26px\"><div class=\"date acc\" style=\"font-size:34px\">21 May 2008<\u002Fdiv><p style=\"font-weight:600;margin-top:6px\">Einhorn criticises Lehman<\u002Fp><p class=\"sec\" style=\"font-size:24px\">at the Ira Sohn conference<\u002Fp><\u002Fdiv><div data-b=\"4\" style=\"position:absolute;left:1333px;top:400px;width:64px;height:64px;border-radius:20px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);color:#1E8A3E;display:flex;align-items:center;justify-content:center\"><svg class=\"ic\" width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 5l6 6 4-4 8 8\"><\u002Fpath><path d=\"M15 15h6v-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div data-b=\"4\" class=\"card\" style=\"position:absolute;left:1333px;top:480px;width:360px;padding:22px 26px;border-radius:26px\"><div class=\"date acc\" style=\"font-size:34px\">9 Jun 2008<\u002Fdiv><p style=\"font-weight:600;margin-top:6px\">$2.8 bn loss<\u002Fp><p class=\"sec\" style=\"font-size:24px\">the first since the IPO<\u002Fp><\u002Fdiv><div data-b=\"5\" style=\"position:absolute;left:1373px;top:244px;width:64px;height:64px;border-radius:20px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);color:#1E8A3E;display:flex;align-items:center;justify-content:center\"><svg class=\"ic\" width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h16v11H9.5L4 20z\"><\u002Fpath><path d=\"M8 9.5h8M8 12.5h5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div data-b=\"5\" class=\"card\" style=\"position:absolute;left:1373px;top:44px;width:307px;padding:22px 26px;border-radius:26px\"><div class=\"date acc\" style=\"font-size:34px\">12 Jun 2008<\u002Fdiv><p style=\"font-weight:600;margin-top:6px\">Lee tells E&amp;Y<\u002Fp><p class=\"sec\" style=\"font-size:24px\">about Repo 105<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: Fed press release (16 Mar 2008); Valukas (2010); Einhorn speech (21 May 2008); Lehman 8-K (9 Jun 2008)<\u002Fspan><span class=\"pg\">6 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:40 (total 3:25)\">Then the signals came. Bear Stearns fell on the 16th of March. On the 16th of May, Matthew Lee wrote a letter about accounting problems. On the 21st of May, investor David Einhorn criticised Lehman. On the 9th of June, Lehman announced a loss of 2.8 billion dollars. It was the first loss since the IPO. On the 12th of June, Lee told the auditor, Ernst and Young, about Repo 105.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide dark\" id=\"s7\">\n  <div class=\"jpm jp\"><b>〇七<\u002Fb>最後の一週間<\u002Fdiv>\n  <div class=\"eyebrow\">Stages 4–5 · The last week <span class=\"dt\">· 9 – 15 Sep 2008<\u002Fspan><\u002Fdiv>\n  <h2>Seven days from trigger to Chapter 11.<\u002Fh2>\n  <div class=\"body\" style=\"margin-top:34px\">\n    <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:0 18px\">\n      <div data-b=\"6\" style=\"grid-column:1 / span 4;margin-bottom:18px\"><span class=\"pill g\">Window 1 · 9–12 Sep<\u002Fspan> <span style=\"font-size:24px;margin-left:10px\" class=\"sec\">raise capital or sell the bank<\u002Fspan><\u002Fdiv>\n      <div data-b=\"6\" style=\"grid-column:5;margin-bottom:18px\"><span class=\"pill g\">Window 2 · 13–14 Sep<\u002Fspan><\u002Fdiv>\n      <div data-b=\"6\" style=\"grid-column:6;margin-bottom:18px\"><span class=\"pill\">15 Sep · closed<\u002Fspan><\u002Fdiv>\n      <div data-b=\"1\" style=\"background:#1C1C1E;color:#F5F5F7;border-radius:30px;padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px;min-height:520px\"><p style=\"font-size:24px;font-weight:700;color:#32D74B\">Tue<\u002Fp><div class=\"big\" style=\"font-size:88px;letter-spacing:-.05em;line-height:.95\">9<\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6;margin-top:-4px\">Sep 2008<\u002Fp><div style=\"color:#32D74B;margin-top:10px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2.8c.8 3.7 5.2 5.2 5.2 10.2a5.2 5.2 0 0 1-10.4 0c0-2.8 1.8-4 2.1-6.1 1 1 1.4 2 1.4 3.1 1.3-2 1.9-4.2 1.7-7.2z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p style=\"font-size:24px;font-weight:600\">KDB talks fail<\u002Fp><div class=\"big\" style=\"font-size:52px;color:#32D74B\">45%<\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6\">share price fall<\u002Fp><span class=\"pill g\" style=\"align-self:flex-start\">Trigger<\u002Fspan><\u002Fdiv><div data-b=\"2\" style=\"background:#1C1C1E;color:#F5F5F7;border-radius:30px;padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px;min-height:520px\"><p style=\"font-size:24px;font-weight:700;color:#32D74B\">Wed<\u002Fp><div class=\"big\" style=\"font-size:88px;letter-spacing:-.05em;line-height:.95\">10<\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6;margin-top:-4px\">Sep 2008<\u002Fp><div style=\"color:#32D74B;margin-top:10px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 5l6 6 4-4 8 8\"><\u002Fpath><path d=\"M15 15h6v-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p style=\"font-size:24px;font-weight:600\">Q3 loss<\u002Fp><div class=\"big\" style=\"font-size:52px;color:#F5F5F7\">$3.9 bn<\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6\">liquidity pool reported: about $42 bn<\u002Fp><\u002Fdiv><div style=\"opacity:.45;background:#1C1C1E;color:#F5F5F7;border-radius:30px;padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px;min-height:520px\"><p style=\"font-size:24px;font-weight:700;color:#32D74B\">Thu<\u002Fp><div class=\"big\" style=\"font-size:88px;letter-spacing:-.05em;line-height:.95\">11<\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6;margin-top:-4px\">Sep 2008<\u002Fp><p style=\"font-size:24px;color:#A1A1A6\">no dated event in our sources<\u002Fp><\u002Fdiv><div data-b=\"3\" style=\"background:#1C1C1E;color:#F5F5F7;border-radius:30px;padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px;min-height:520px\"><p style=\"font-size:24px;font-weight:700;color:#32D74B\">Fri<\u002Fp><div class=\"big\" style=\"font-size:88px;letter-spacing:-.05em;line-height:.95\">12<\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6;margin-top:-4px\">Sep 2008<\u002Fp><div style=\"color:#32D74B;margin-top:10px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2.5 7h19v10h-19z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.6\"><\u002Fcircle><path d=\"M6 10v4M18 10v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p style=\"font-size:24px;font-weight:600\">Cash is gone<\u002Fp><div class=\"big\" style=\"font-size:52px;color:#32D74B\">&lt; $2 bn<\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6\">easily available<\u002Fp><\u002Fdiv><div data-b=\"4\" style=\"background:#1C1C1E;color:#F5F5F7;border-radius:30px;padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px;min-height:520px\"><p style=\"font-size:24px;font-weight:700;color:#32D74B\">Sat–Sun<\u002Fp><div class=\"big\" style=\"font-size:64px;letter-spacing:-.05em;line-height:1.4\">13–14<\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6;margin-top:-4px\">Sep 2008<\u002Fp><div style=\"color:#32D74B;margin-top:10px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9.5h18\"><\u002Fpath><path d=\"M12 3l9 5H3z\"><\u002Fpath><path d=\"M5.5 10v8M10 10v8M14 10v8M18.5 10v8\"><\u002Fpath><path d=\"M3 21h18\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p style=\"font-size:24px;color:#A1A1A6\">Sunday 14 Sep<\u002Fp><p style=\"font-size:24px;font-weight:600\">Bank of America agrees to buy Merrill Lynch<\u002Fp><p style=\"font-size:24px;font-weight:600\">UK FSA declines to approve the Barclays deal<\u002Fp><\u002Fdiv><div data-b=\"5\" style=\"background:#F5F5F7;color:#0A0A0C;border-radius:30px;padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px;min-height:520px\"><p style=\"font-size:24px;font-weight:700;color:#1E8A3E\">Mon<\u002Fp><div class=\"big\" style=\"font-size:88px;letter-spacing:-.05em;line-height:.95\">15<\u002Fdiv><p style=\"font-size:24px;color:#6E6E73;margin-top:-4px\">Sep 2008<\u002Fp><div style=\"color:#1E8A3E;margin-top:10px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M9 9l6 6M15 9l-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p style=\"font-size:24px;font-weight:600\">Chapter 11<\u002Fp><div class=\"big\" style=\"font-size:52px;color:#0A0A0C\">$639 bn<\u002Fdiv><p style=\"font-size:24px;color:#6E6E73\">in assets; the largest in US history<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p data-b=\"6\" class=\"sec\" style=\"font-size:24px;margin-top:22px\">Window 2: a buyer or public money. Windows are our reading of when a decision could still change the outcome.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: FCIC (2011), ch. 18; Lehman 8-K (10 Sep 2008); Valukas (2010)<\u002Fspan><span class=\"pg\">7 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:40 (total 4:05)\">The last week. On the 9th of September, talks with the Korea Development Bank failed, and the share price fell by 45 percent. On the 10th, Lehman announced a loss of 3.9 billion dollars. By the 12th, less than 2 billion dollars was easily available. On Sunday, the 14th, Bank of America agreed to buy Merrill Lynch, and the British regulator did not approve a deal with Barclays. On the 15th, Lehman filed for Chapter 11.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide light\" id=\"s8\">\n  <div class=\"jpm jp\"><b>〇八<\u002Fb>五つの段階<\u002Fdiv>\n  <div class=\"eyebrow\">Lecture 2 framework <span class=\"dt\">· 2006 – 9 Sep 2008<\u002Fspan><\u002Fdiv>\n  <h2>Five stages. One pattern.<\u002Fh2>\n  <div class=\"body\" style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-top:40px\">\n    <div data-b=\"1\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px;padding:30px 28px\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3c4 0 7 6.2 7 10.5a7 7 0 0 1-14 0C5 9.2 8 3 12 3z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Stage 1<\u002Fp><h3>Incubation<\u002Fh3><p style=\"flex:1\">Growth on borrowed money; limits raised after each breach; Archstone above limits<\u002Fp><div class=\"date acc\" style=\"font-size:28px\">2006–2007<\u002Fdiv><\u002Fdiv>\n    <div data-b=\"2\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px;padding:30px 28px\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 16.5V11a6 6 0 0 1 12 0v5.5l2 2H4z\"><\u002Fpath><path d=\"M10 21h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Stage 2<\u002Fp><h3>Signal<\u002Fh3><p style=\"flex:1\">Lee tells the auditor about Repo 105; the audit committee writes “no material issues”<\u002Fp><div class=\"date acc\" style=\"font-size:28px\">12 Jun · Jul 2008<\u002Fdiv><\u002Fdiv>\n    <div data-b=\"3\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px;padding:30px 28px\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8.2-8 9.3C7.5 20.2 4 17 4 12V6z\"><\u002Fpath><path d=\"M12.5 7l-2.2 4.2 3 1.8-2 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Stage 3<\u002Fp><h3>Degraded defence<\u002Fh3><p style=\"flex:1\">Risk management: the CFO becomes head of risk, the CRO is moved aside<\u002Fp><div class=\"date acc\" style=\"font-size:28px\">from 1 Dec 2007<\u002Fdiv><\u002Fdiv>\n    <div data-b=\"4\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px;padding:30px 28px\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3.5 17a8.5 8.5 0 1 1 17 0\"><\u002Fpath><path d=\"M12 17l4.5-5.5\"><\u002Fpath><circle cx=\"12\" cy=\"17\" r=\"1.2\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Stage 4<\u002Fp><h3>Pressure<\u002Fh3><p style=\"flex:1\">The market and rating agencies want lower leverage after Bear Stearns<\u002Fp><div class=\"date acc\" style=\"font-size:28px\">from 16 Mar 2008<\u002Fdiv><\u002Fdiv>\n    <div data-b=\"5\" class=\"card\" style=\"display:flex;flex-direction:column;gap:16px;padding:30px 28px;background:var(--ink);color:var(--w)\"><div class=\"ico\" style=\"background:#2C2C2E;color:var(--gd)\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2.8c.8 3.7 5.2 5.2 5.2 10.2a5.2 5.2 0 0 1-10.4 0c0-2.8 1.8-4 2.1-6.1 1 1 1.4 2 1.4 3.1 1.3-2 1.9-4.2 1.7-7.2z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p style=\"font-size:24px;font-weight:600;color:#A1A1A6\">Stage 5<\u002Fp><h3>Trigger<\u002Fh3><p style=\"flex:1\">KDB talks fail; the share price falls 45%. <b style=\"color:var(--gd)\">Not the cause.<\u002Fb><\u002Fp><div class=\"date\" style=\"font-size:28px;color:var(--gd)\">9 Sep 2008<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p data-b=\"6\" style=\"margin-top:26px;font-size:30px;font-weight:600;letter-spacing:-.01em\">The trigger started the collapse. The causes had been in place for two years.<\u002Fp>\n  <div class=\"foot\"><span>Sources: Valukas (2010); FCIC (2011), ch. 18<\u002Fspan><span class=\"pg\">8 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:40 (total 4:45)\">Now we check the five stages from the lecture. Incubation lasted about two years. The signal was reported and handled: Lee told the auditor, and in July the audit committee wrote \"no material issues\". The degraded defence was risk management. The pressure came from the market and the rating agencies after Bear Stearns. The trigger was the failed deal with KDB. It started the collapse, but it was not the cause.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide dark\" id=\"s9\">\n  <div class=\"jpm jp\"><b>〇九<\u002Fb>根本原因<\u002Fdiv>\n  <div class=\"eyebrow\">Root cause · Bow-tie <span class=\"dt\">· event: 9–12 Sep 2008<\u002Fspan><\u002Fdiv>\n  <h2>Ten defences. None held.<\u002Fh2>\n  <div class=\"body\" style=\"margin-top:34px;display:flex;flex-direction:column;gap:26px\">\n    <div style=\"position:relative;height:30px;font-size:24px;font-weight:600;color:var(--g1);margin-bottom:-6px\"><span style=\"position:absolute;left:0\">Threats<\u002Fspan><span style=\"position:absolute;left:540px;transform:translateX(-50%)\">Before the event<\u002Fspan><span style=\"position:absolute;left:840px;transform:translateX(-50%)\">Event<\u002Fspan><span style=\"position:absolute;left:1140px;transform:translateX(-50%)\">After the event<\u002Fspan><span style=\"position:absolute;left:1360px\">Consequences<\u002Fspan><\u002Fdiv>\n    <svg width=\"1680\" height=\"440\" viewBox=\"0 0 1680 440\" style=\"display:block\" aria-label=\"Bow-tie: four threats, six failed defences before the event, loss of confidence 9 to 12 September 2008, four failed defences after, four consequences\"><g data-b=\"1\"><path d=\"M340 20 L740 150 L740 290 L340 420 Z\" fill=\"#161618\"><\u002F
