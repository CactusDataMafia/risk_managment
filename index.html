\"M944 220 L1360 168\" stroke=\"#2C2C2E\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><path d=\"M944 220 L1360 272\" stroke=\"#2C2C2E\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><path d=\"M944 220 L1360 376\" stroke=\"#2C2C2E\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><rect x=\"995.0\" y=\"130.5\" width=\"10\" height=\"179.0\" rx=\"5.0\" fill=\"#FF453A\"><\u002Frect><text x=\"1000\" y=\"116.5\" font-size=\"24\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"middle\" font-weight=\"700\">7<\u002Ftext><rect x=\"1085.0\" y=\"101.2\" width=\"10\" height=\"237.5\" rx=\"5.0\" fill=\"#FF453A\"><\u002Frect><text x=\"1090\" y=\"87.25\" font-size=\"24\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"middle\" font-weight=\"700\">8<\u002Ftext><rect x=\"1175.0\" y=\"72.0\" width=\"10\" height=\"296.0\" rx=\"5.0\" fill=\"#FF453A\"><\u002Frect><text x=\"1180\" y=\"58.0\" font-size=\"24\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"middle\" font-weight=\"700\">9<\u002Ftext><rect x=\"1265.0\" y=\"42.8\" width=\"10\" height=\"354.5\" rx=\"5.0\" fill=\"#FF453A\"><\u002Frect><text x=\"1270\" y=\"28.75\" font-size=\"24\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"middle\" font-weight=\"700\">10<\u002Ftext><rect x=\"1360\" y=\"20\" width=\"320\" height=\"88\" rx=\"22\" fill=\"#1C1C1E\"><\u002Frect><text x=\"1384\" y=\"58\" font-size=\"26\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"start\" font-weight=\"600\">Chapter 11<\u002Ftext><text x=\"1384\" y=\"90\" font-size=\"24\" font-family=\"Inter\" fill=\"#A1A1A6\" text-anchor=\"start\" font-weight=\"400\">15 Sep 2008 · $639 bn<\u002Ftext><rect x=\"1360\" y=\"124\" width=\"320\" height=\"88\" rx=\"22\" fill=\"#1C1C1E\"><\u002Frect><text x=\"1384\" y=\"162\" font-size=\"26\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"start\" font-weight=\"600\">Bank holding cos<\u002Ftext><text x=\"1384\" y=\"194\" font-size=\"24\" font-family=\"Inter\" fill=\"#A1A1A6\" text-anchor=\"start\" font-weight=\"400\">GS, MS · 21 Sep 2008<\u002Ftext><rect x=\"1360\" y=\"228\" width=\"320\" height=\"88\" rx=\"22\" fill=\"#1C1C1E\"><\u002Frect><text x=\"1384\" y=\"266\" font-size=\"26\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"start\" font-weight=\"600\">CSE programme ends<\u002Ftext><text x=\"1384\" y=\"298\" font-size=\"24\" font-family=\"Inter\" fill=\"#A1A1A6\" text-anchor=\"start\" font-weight=\"400\">26 Sep 2008<\u002Ftext><rect x=\"1360\" y=\"332\" width=\"320\" height=\"88\" rx=\"22\" fill=\"#1C1C1E\"><\u002Frect><text x=\"1384\" y=\"370\" font-size=\"26\" font-family=\"Inter\" fill=\"#F5F5F7\" text-anchor=\"start\" font-weight=\"600\">Examiner's report<\u002Ftext><text x=\"1384\" y=\"402\" font-size=\"24\" font-family=\"Inter\" fill=\"#A1A1A6\" text-anchor=\"start\" font-weight=\"400\">11 Mar 2010<\u002Ftext><\u002Fg><g data-b=\"2\"><circle cx=\"840\" cy=\"220\" r=\"112\" fill=\"#F5F5F7\"><\u002Fcircle><text x=\"840\" y=\"204\" font-size=\"30\" font-family=\"Inter\" fill=\"#0A0A0C\" text-anchor=\"middle\" font-weight=\"700\">Loss of<\u002Ftext><text x=\"840\" y=\"240\" font-size=\"30\" font-family=\"Inter\" fill=\"#0A0A0C\" text-anchor=\"middle\" font-weight=\"700\">confidence<\u002Ftext><text x=\"840\" y=\"276\" font-size=\"24\" font-family=\"Inter\" fill=\"#1E8A3E\" text-anchor=\"middle\" font-weight=\"600\">9–12 Sep 2008<\u002Ftext><\u002Fg><\u002Fsvg>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <div data-b=\"3\" class=\"card\" style=\"padding:18px 26px\"><p style=\"font-size:24px\"><b style=\"color:var(--rd)\">1<\u002Fb> Risk limits &nbsp;&nbsp; <b style=\"color:var(--rd)\">2<\u002Fb> CRO &nbsp;&nbsp; <b style=\"color:var(--rd)\">3<\u002Fb> Board &nbsp;&nbsp; <b style=\"color:var(--rd)\">4<\u002Fb> Disclosure &nbsp;&nbsp; <b style=\"color:var(--rd)\">5<\u002Fb> E&amp;Y audit &nbsp;&nbsp; <b style=\"color:var(--rd)\">6<\u002Fb> SEC<\u002Fp><\u002Fdiv>\n      <div data-b=\"5\" class=\"card\" style=\"padding:18px 26px\"><p style=\"font-size:24px\"><b style=\"color:var(--rd)\">7<\u002Fb> Liquidity pool &nbsp;&nbsp; <b style=\"color:var(--rd)\">8<\u002Fb> New capital &nbsp;&nbsp; <b style=\"color:var(--rd)\">9<\u002Fb> Buyer &nbsp;&nbsp; <b style=\"color:var(--rd)\">10<\u002Fb> Public money<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p data-b=\"6\" style=\"font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.3\">Valukas: the Fed had the skills but not the authority; the SEC had the authority but perhaps not the skills. <span class=\"acc\">They did not share data.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: Valukas (2010); Valukas testimony (20 Apr 2010); SEC OIG (2008), Report 446-A; SEC press release 2008-230<\u002Fspan><span class=\"pg\">9 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"1:00 (total 5:45)\">This is our bow-tie. On the left are four threats: very high leverage, illiquid assets, funding that had to be renewed every night, and pressure. In the centre: counterparties lost confidence, and the funding disappeared. Before the event there were six defences, and all of them failed. The last line was the SEC. After the event, four more defences failed. The cash was pledged, and there was no new capital, no buyer and no public money. Valukas says the Fed had the skills but not the authority. The SEC had the authority, but maybe not the skills. And they did not share data.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide light\" id=\"s10\">\n  <div class=\"jpm jp\"><b>一〇<\u002Fb>防御の層<\u002Fdiv>\n  <div class=\"eyebrow\">Root cause · Defence levels <span class=\"dt\">· 2006 – Sep 2008<\u002Fspan><\u002Fdiv>\n  <h2>What each defence was for, and what it did.<\u002Fh2>\n  <div class=\"body\" style=\"display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:22px;margin-top:34px\">\n    <div data-b=\"1\" class=\"card\" style=\"padding:26px 30px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div class=\"ico red\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8.2-8 9.3C7.5 20.2 4 17 4 12V6z\"><\u002Fpath><path d=\"M12.5 7l-2.2 4.2 3 1.8-2 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"display:flex;gap:8px\"><span class=\"pill\" style=\"\">2006 – 29 May 2007<\u002Fspan><\u002Fdiv><\u002Fdiv><h3 style=\"font-size:30px\">Risk limits<\u002Fh3><p class=\"sec\" style=\"font-size:24px;\">Designed to cap the risk the firm takes<\u002Fp><p style=\"font-size:24px\">exceeded, then raised; Archstone above limits<\u002Fp><\u002Fdiv><div data-b=\"2\" class=\"card\" style=\"padding:26px 30px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div class=\"ico red\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8.2-8 9.3C7.5 20.2 4 17 4 12V6z\"><\u002Fpath><path d=\"M12.5 7l-2.2 4.2 3 1.8-2 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"display:flex;gap:8px\"><span class=\"pill\" style=\"\">from 1 Dec 2007<\u002Fspan><\u002Fdiv><\u002Fdiv><h3 style=\"font-size:30px\">CRO and stress tests<\u002Fh3><p class=\"sec\" style=\"font-size:24px;\">Designed to give an independent view of risk<\u002Fp><p style=\"font-size:24px\">CRO moved aside; CFO heads risk<\u002Fp><\u002Fdiv><div data-b=\"3\" class=\"card\" style=\"padding:26px 30px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div class=\"ico red\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8.2-8 9.3C7.5 20.2 4 17 4 12V6z\"><\u002Fpath><path d=\"M12.5 7l-2.2 4.2 3 1.8-2 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"display:flex;gap:8px\"><span class=\"pill\" style=\"\">Jun – Jul 2008<\u002Fspan><\u002Fdiv><\u002Fdiv><h3 style=\"font-size:30px\">Board of directors<\u002Fh3><p class=\"sec\" style=\"font-size:24px;\">Designed to oversee management<\u002Fp><p style=\"font-size:24px\">risk committee met twice a year; audit committee not told of Lee's claims<\u002Fp><\u002Fdiv><div data-b=\"4\" class=\"card\" style=\"padding:26px 30px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div class=\"ico red\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8.2-8 9.3C7.5 20.2 4 17 4 12V6z\"><\u002Fpath><path d=\"M12.5 7l-2.2 4.2 3 1.8-2 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"display:flex;gap:8px\"><span class=\"pill\" style=\"\">Q4 2007 – Q2 2008<\u002Fspan><\u002Fdiv><\u002Fdiv><h3 style=\"font-size:30px\">Disclosure<\u002Fh3><p class=\"sec\" style=\"font-size:24px;\">Designed to show investors the true position<\u002Fp><p style=\"font-size:24px\">Repo 105 not disclosed: $50.38 bn in Q2 2008<\u002Fp><\u002Fdiv><div data-b=\"5\" class=\"card\" style=\"padding:26px 30px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div class=\"ico red\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8.2-8 9.3C7.5 20.2 4 17 4 12V6z\"><\u002Fpath><path d=\"M12.5 7l-2.2 4.2 3 1.8-2 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"display:flex;gap:8px\"><span class=\"pill\" style=\"\">13 Jun 2008<\u002Fspan><\u002Fdiv><\u002Fdiv><h3 style=\"font-size:30px\">Auditor E&amp;Y<\u002Fh3><p class=\"sec\" style=\"font-size:24px;\">Designed to test the accounts<\u002Fp><p style=\"font-size:24px\">checked the policy, not the practice; did not raise Lee's claims<\u002Fp><\u002Fdiv><div data-b=\"6\" class=\"card\" style=\"padding:26px 30px;display:flex;flex-direction:column;gap:10px;background:#1D1D1F;color:#F5F5F7\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div class=\"ico red\" style=\"width:64px;height:64px;border-radius:20px;background:#3A1A1A;color:#FF453A\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8.2-8 9.3C7.5 20.2 4 17 4 12V6z\"><\u002Fpath><path d=\"M12.5 7l-2.2 4.2 3 1.8-2 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"display:flex;gap:8px\"><span class=\"pill g\" style=\"background:#32D74B;color:#04210D\">last line<\u002Fspan> <span class=\"pill\" style=\"background:#2C2C2E;color:#F5F5F7\">from Oct 2007<\u002Fspan><\u002Fdiv><\u002Fdiv><h3 style=\"font-size:30px\">SEC supervision (CSE)<\u002Fh3><p class=\"sec\" style=\"font-size:24px;color:#A1A1A6\">Designed to supervise the whole firm<\u002Fp><p style=\"font-size:24px\">voluntary; knew of limit breaches; collected data, did not act<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: Valukas (2010); SEC OIG (2008), Report 446-A<\u002Fspan><span class=\"pg\">10 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:30 (total 6:15)\">Now the six defences in detail. Risk limits were raised after every breach. The risk officer was moved aside. The board risk committee met only twice a year. Repo 105 was not disclosed. The auditor checked the policy, not the practice. And the SEC programme was voluntary. The SEC collected data, but it did not act.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide light\" id=\"s11\">\n  <div class=\"jpm jp\"><b>一一<\u002Fb>弱いシグナル<\u002Fdiv>\n  <div class=\"eyebrow\">Weak signals review <span class=\"dt\">· Oct 2007 – Jul 2008<\u002Fspan><\u002Fdiv>\n  <h2>Every signal stopped at one person.<\u002Fh2>\n  <div class=\"body\" style=\"margin-top:30px\">\n    <table class=\"t\">\n      <tbody><tr><th style=\"width:84px\"><\u002Fth><th style=\"width:520px\">Signal<\u002Fth><th style=\"width:270px\">When<\u002Fth><th style=\"width:300px\">Where it stopped<\u002Fth><th>Why it was ignored<\u002Fth><\u002Ftr>\n      <tr data-b=\"1\"><td><div class=\"ico\" style=\"width:60px;height:60px;border-radius:18px\"><svg class=\"ic\" width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3.5l9.5 17h-19z\"><\u002Fpath><path d=\"M12 10v4.5\"><\u002Fpath><path d=\"M12 17.5v.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Ftd><td>Broken risk limits, reported to the SEC<\u002Ftd><td class=\"date acc\">from Oct 2007<\u002Ftd><td>SEC, CSE programme<\u002Ftd><td>voluntary programme; data collected, no action<\u002Ftd><\u002Ftr>\n      <tr data-b=\"2\"><td><div class=\"ico\" style=\"width:60px;height:60px;border-radius:18px\"><svg class=\"ic\" width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h16v11H9.5L4 20z\"><\u002Fpath><path d=\"M8 9.5h8M8 12.5h5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Ftd><td>Staff call Repo 105 “window dressing”, “another drug we are on”<\u002Ftd><td class=\"sec\" style=\"font-size:24px\">no date in our sources<\u002Ftd><td>inside Lehman<\u002Ftd><td>Repo 105 had become routine each quarter<\u002Ftd><\u002Ftr>\n      <tr data-b=\"2\"><td><div class=\"ico\" style=\"width:60px;height:60px;border-radius:18px\"><svg class=\"ic\" width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18\"><\u002Fpath><path d=\"M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Ftd><td>No US law firm calls Repo 105 a true sale<\u002Ftd><td class=\"sec\" style=\"font-size:24px\">no date in our sources<\u002Ftd><td>Lehman management<\u002Ftd><td>deals run through London instead<\u002Ftd><\u002Ftr>\n      <tr data-b=\"3\"><td><div class=\"ico\" style=\"width:60px;height:60px;border-radius:18px\"><svg class=\"ic\" width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9.5h18\"><\u002Fpath><path d=\"M12 3l9 5H3z\"><\u002Fpath><path d=\"M5.5 10v8M10 10v8M14 10v8M18.5 10v8\"><\u002Fpath><path d=\"M3 21h18\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Ftd><td>Bear Stearns falls<\u002Ftd><td class=\"date acc\">16 Mar 2008<\u002Ftd><td>management and board<\u002Ftd><td>belief that the state would save them<\u002Ftd><\u002Ftr>\n      <tr data-b=\"4\"><td><div class=\"ico\" style=\"width:60px;height:60px;border-radius:18px\"><svg class=\"ic\" width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 10v4h4l8 5V5l-8 5z\"><\u002Fpath><path d=\"M18.5 9a4.5 4.5 0 0 1 0 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Ftd><td>David Einhorn's public criticism<\u002Ftd><td class=\"date acc\">21 May 2008<\u002Ftd><td>management<\u002Ftd><td>blamed on short sellers<\u002Ftd><\u002Ftr>\n      <tr data-b=\"5\"><td><div class=\"ico\" style=\"width:60px;height:60px;border-radius:18px\"><svg class=\"ic\" width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 5.5h18v13H3z\"><\u002Fpath><path d=\"M3 6.5l9 7 9-7\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Ftd><td>Lee's letter; Lee tells E&amp;Y about $50 bn of Repo 105<\u002Ftd><td class=\"date acc\">16 May, 12 Jun 2008<\u002Ftd><td>auditor E&amp;Y<\u002Ftd><td>not raised with the audit committee on 13 Jun; July: “no material issues”<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: Valukas (2010); Einhorn speech (21 May 2008)<\u002Fspan><span class=\"pg\">11 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:45 (total 7:00)\">Where was the whistle that no one heard? The SEC knew about the broken limits from October 2007. Inside the bank, people called Repo 105 \"window dressing\". No American law firm agreed that these deals were real sales. Lee told Ernst and Young about 50 billion dollars of Repo 105. The next day, the auditor met the audit committee and did not mention it. Each signal stopped at one person, and that person relied on someone else.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide dark\" id=\"s12\" style=\"padding-top:76px\">\n  <div class=\"jpm jp\"><b>一二<\u002Fb>バイアス監査<\u002Fdiv>\n  <div class=\"eyebrow\">Bias audit <span class=\"dt\">· 2006 – 2008<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:58px\">Four failures that decided the outcome.<\u002Fh2>\n  <div class=\"body\" style=\"display:flex;flex-direction:column;gap:20px;margin-top:28px\">\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\">\n      <div data-b=\"1\" class=\"card\" style=\"display:flex;flex-direction:column;gap:12px;padding:28px 28px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"ico\" style=\"width:72px;height:72px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 17L17 3l4 4L7 21z\"><\u002Fpath><path d=\"M7 13l2 2M10 10l2 2M13 7l2 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span class=\"pill\">organisational<\u002Fspan><\u002Fdiv><h3 style=\"font-size:30px\">Normalisation of deviance<\u002Fh3><p style=\"font-size:24px\">Limits broken, then raised, <b>2006–2007<\u002Fb>; Repo 105 every quarter end, <b>Q4 2007 – Q2 2008<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px;margin-top:auto\">Hindsight check: visible at the time; the SEC knew from Oct 2007<\u002Fp><\u002Fdiv>\n      <div data-b=\"2\" class=\"card\" style=\"display:flex;flex-direction:column;gap:12px;padding:28px 28px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"ico\" style=\"width:72px;height:72px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M13.5 15.5l-5-5C10.5 5.5 14.5 3 21 3c0 6.5-2.5 10.5-7.5 12.5z\"><\u002Fpath><path d=\"M8.5 10.5H5l2.5-4h4.5\"><\u002Fpath><path d=\"M13.5 15.5V19l4-2.5V12\"><\u002Fpath><path d=\"M6.5 17.5L3.5 20.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span class=\"pill g\">cognitive<\u002Fspan><\u002Fdiv><h3 style=\"font-size:30px\">Overconfidence<\u002Fh3><p style=\"font-size:24px\">Valukas: limits broken in the belief the deals would be profitable; Archstone, <b>29 May 2007<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px;margin-top:auto\">Hindsight check: we judge breaking the limit, not the later loss<\u002Fp><\u002Fdiv>\n      <div data-b=\"3\" class=\"card\" style=\"display:flex;flex-direction:column;gap:12px;padding:28px 28px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"ico\" style=\"width:72px;height:72px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 8l4.5 4.5L12 5l4.5 7.5L21 8l-2 11H5z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span class=\"pill\">organisational<\u002Fspan><\u002Fdiv><h3 style=\"font-size:30px\">Deference to authority<\u002Fh3><p style=\"font-size:24px\">The CRO who disagreed is moved aside; the CFO heads risk from <b>1 Dec 2007<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px;margin-top:auto\">Hindsight check: the dissent existed before the collapse<\u002Fp><\u002Fdiv>\n      <div data-b=\"4\" class=\"card\" style=\"display:flex;flex-direction:column;gap:12px;padding:28px 28px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"ico\" style=\"width:72px;height:72px\"><svg class=\"ic\" width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><span class=\"pill g\">cognitive<\u002Fspan><\u002Fdiv><h3 style=\"font-size:30px\">Confirmation bias<\u002Fh3><p style=\"font-size:24px\">After Bear Stearns, <b>16 Mar 2008<\u002Fb>: belief the state would save them; Einhorn blamed on short sellers, <b>21 May 2008<\u002Fb><\u002Fp><p class=\"sec\" style=\"font-size:24px;margin-top:auto\">Hindsight check: hope was reasonable; ignoring counter-signals was not<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-b=\"5\" style=\"display:grid;grid-template-columns:1fr 1fr 330px;gap:20px\">\n      <div class=\"card\" style=\"padding:22px 28px\"><p class=\"sec\" style=\"font-size:24px;font-weight:600\">The wrong question<\u002Fp><p style=\"font-size:26px;font-weight:600\">“What is our leverage on the last day of the quarter?”<\u002Fp><\u002Fdiv>\n      <div class=\"card\" style=\"padding:22px 28px\"><p class=\"sec\" style=\"font-size:24px;font-weight:600\">The right question<\u002Fp><p style=\"font-size:26px;font-weight:600\">“How much risk do we carry?”<\u002Fp><\u002Fdiv>\n      <div class=\"card\" style=\"padding:22px 28px\"><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Repo 105 · Q2 2008<\u002Fp><p class=\"big acc\" style=\"font-size:40px;margin-top:4px\">12.1 not ≈13.9<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p data-b=\"6\" style=\"font-size:32px;font-weight:700;letter-spacing:-.02em\">Name the pressure, not the villain: <span class=\"acc\">first to grow, then to look safe.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Source: Valukas (2010)<\u002Fspan><span class=\"pg\">12 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:50 (total 7:50)\">We found four failures. First, normalisation of deviance: when a limit was broken, managers raised the limit. Second, overconfidence: managers believed the deals would be profitable. Third, deference to authority: the risk officer who disagreed was moved aside. Fourth, confirmation bias: after Bear Stearns, managers believed the state would save them. The key mechanism is the wrong question. Lehman asked: \"What is our leverage on the last day of the quarter?\" and not \"How much risk do we carry?\" We name the pressure, not a villain: first to grow, then to look safe.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide dark\" id=\"s13\">\n  <div class=\"jpm jp\"><b>一三<\u002Fb>反実仮想<\u002Fdiv>\n  <div class=\"eyebrow\">Counterfactual <span class=\"dt\">· late 2006 – Jun 2008<\u002Fspan><\u002Fdiv>\n  <h2>Three decisions that change who can say no.<\u002Fh2>\n  <div class=\"body\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px\">\n    <div data-b=\"1\" class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;padding:30px 32px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15.5\" r=\"4.5\"><\u002Fcircle><path d=\"M11.2 12.3L20.5 3\"><\u002Fpath><path d=\"M17 6.5l3 3M14.5 9l2 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span class=\"big\" style=\"font-size:64px;color:#3A3A3C\">1<\u002Fspan><\u002Fdiv><h3>CRO with a veto<\u002Fh3><p style=\"font-size:24px\">The CRO reports to the board; only the board committee can raise a limit<\u002Fp><div class=\"date acc\" style=\"font-size:30px\">late 2006 – early 2007<\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Mechanism<\u002Fp><p style=\"font-size:24px\">Valukas: with its own limits, no Archstone deal (29 May 2007)<\u002Fp><\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Limit<\u002Fp><p style=\"font-size:24px\">works only if the board uses the veto<\u002Fp><\u002Fdiv><div style=\"margin-top:auto;border-top:1px solid #3A3A3C;padding-top:14px\"><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Cost<\u002Fp><p class=\"acc\" style=\"font-size:30px;font-weight:700;letter-spacing:-.01em\">lower profit in the boom years<\u002Fp><\u002Fdiv><\u002Fdiv><div data-b=\"2\" class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;padding:30px 32px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5.2l3.3 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span class=\"big\" style=\"font-size:64px;color:#3A3A3C\">2<\u002Fspan><\u002Fdiv><h3>Mandatory escalation<\u002Fh3><p style=\"font-size:24px\">Every report of accounting problems reaches the audit committee within 48 hours<\u002Fp><div class=\"date acc\" style=\"font-size:30px\">June 2008 (Lee: 12 Jun)<\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Mechanism<\u002Fp><p style=\"font-size:24px\">Lee's claims reach the committee before July<\u002Fp><\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Limit<\u002Fp><p style=\"font-size:24px\">no rescue; a softer landing<\u002Fp><\u002Fdiv><div style=\"margin-top:auto;border-top:1px solid #3A3A3C;padding-top:14px\"><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Cost<\u002Fp><p class=\"acc\" style=\"font-size:30px;font-weight:700;letter-spacing:-.01em\">an earlier fall in the share price<\u002Fp><\u002Fdiv><\u002Fdiv><div data-b=\"3\" class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;padding:30px 32px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"ico\"><svg class=\"ic\" width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12.5V3h9.5l8.5 8.5-9.5 9.5z\"><\u002Fpath><circle cx=\"7.5\" cy=\"7.5\" r=\"1.6\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><span class=\"big\" style=\"font-size:64px;color:#3A3A3C\">3<\u002Fspan><\u002Fdiv><h3>Board right to sell<\u002Fh3><p style=\"font-size:24px\">The board can start a sale of the bank<\u002Fp><div class=\"date acc\" style=\"font-size:30px\">after 16 Mar 2008<\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Mechanism<\u002Fp><p style=\"font-size:24px\">a sale while buyers still exist<\u002Fp><\u002Fdiv><div><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Limit<\u002Fp><p style=\"font-size:24px\">needs a willing buyer<\u002Fp><\u002Fdiv><div style=\"margin-top:auto;border-top:1px solid #3A3A3C;padding-top:14px\"><p class=\"sec\" style=\"font-size:24px;font-weight:600\">Cost<\u002Fp><p class=\"acc\" style=\"font-size:30px;font-weight:700;letter-spacing:-.01em\">a very cheap sale<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: Valukas (2010); team analysis (limits of decisions 1 and 3 are our own assessment)<\u002Fspan><span class=\"pg\">13 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:50 (total 8:40)\">Three decisions could change the outcome. Each has a cost. First, a chief risk officer with a veto, who reports to the board. Valukas says that with its own limits, there would be no Archstone deal. The cost is lower profit in the boom years. Second, every report of accounting problems goes to the audit committee within 48 hours. This gives a softer landing, not a rescue. The cost is an earlier fall in the share price. Third, the board can start a sale after Bear Stearns. The cost is a very cheap sale.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide light\" id=\"s14\">\n  <div class=\"jpm jp\"><b>一四<\u002Fb>争点と限界<\u002Fdiv>\n  <div class=\"eyebrow\">Contested points and limits <span class=\"dt\">· 2008 – 2018<\u002Fspan><\u002Fdiv>\n  <h2>Where sources disagree.<\u002Fh2>\n  <div class=\"body\" style=\"display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:22px;margin-top:34px\">\n    <div data-b=\"1\" class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"display:flex;gap:18px;align-items:center\"><div class=\"ico\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v16.5\"><\u002Fpath><path d=\"M8 21h8\"><\u002Fpath><path d=\"M4.5 7.5h15\"><\u002Fpath><path d=\"M4.5 7.5L2 14a3 3 0 0 0 5 0z\"><\u002Fpath><path d=\"M19.5 7.5L17 14a3 3 0 0 0 5 0z\"><\u002Fpath><circle cx=\"12\" cy=\"4\" r=\"1\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><h3>Could the Fed have saved Lehman?<\u002Fh3><\u002Fdiv><span class=\"pill\">contested<\u002Fspan><\u002Fdiv>\n      <p><b>Bernanke, Paulson<\u002Fb> (FCIC, Jan 2011): no legal power, not enough collateral.<\u002Fp>\n      <p><b>Laurence Ball<\u002Fb> (NBER 2016; book 2018): the power existed; the decision was political.<\u002Fp>\n      <p class=\"acc\" style=\"font-weight:600\">More convincing on the reason: Ball. The Fed gave the FCIC no written analysis of the collateral. Whether a loan would have saved Lehman stays open.<\u002Fp>\n    <\u002Fdiv>\n    <div data-b=\"2\" class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"display:flex;gap:18px;align-items:center\"><div class=\"ico\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 5.5h18v13H3z\"><\u002Fpath><path d=\"M3 6.5l9 7 9-7\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h3>Why did Matthew Lee speak up?<\u002Fh3><\u002Fdiv><span class=\"pill\">contested<\u002Fspan><\u002Fdiv>\n      <p><b>Sorkin, NYT DealBook<\u002Fb> (Mar 2010): Lee raised Repo 105 only when it was clear he was being replaced; his letter of <b>16 May 2008<\u002Fb> did not mention it.<\u002Fp>\n      <p><b>Valukas<\u002Fb> (11 Mar 2010): Lee raised Repo 105 with E&amp;Y on <b>12 Jun 2008<\u002Fb>.<\u002Fp>\n      <p class=\"acc\" style=\"font-weight:600\">More convincing: the documents. Whatever the motive, the Repo 105 figures come from Lehman's own internal reports.<\u002Fp>\n    <\u002Fdiv>\n    <div data-b=\"3\" class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;gap:18px;align-items:center\"><div class=\"ico\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"><\u002Fcircle><path d=\"M2.5 20c0-3.5 2.9-6.3 6.5-6.3s6.5 2.8 6.5 6.3\"><\u002Fpath><path d=\"M16 5a3.2 3.2 0 0 1 0 6.2M18 14c2.3.8 3.5 3 3.5 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h3>The denominator<\u002Fh3><\u002Fdiv>\n      <p>Goldman Sachs and Morgan Stanley had a similar model and survived; both became bank holding companies on <b>21 Sep 2008<\u002Fb>. E&amp;Y said quarter-end deals were common.<\u002Fp>\n      <p style=\"font-weight:700\">Our factors are necessary, not sufficient.<\u002Fp>\n    <\u002Fdiv>\n    <div data-b=\"4\" class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;gap:18px;align-items:center\"><div class=\"ico\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M8 12.5l2.7 2.7L16 10\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h3>Decision, not outcome<\u002Fh3><\u002Fdiv>\n      <p>Valukas (<b>11 Mar 2010<\u002Fb>): no claims over business decisions like Archstone (<b>29 May 2007<\u002Fb>), which is business judgment; possible claims over misleading reports against Fuld and three financial chiefs. No trial.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Sources: FCIC (2011), ch. 18; Ball (2018); Sorkin, NYT DealBook (2010); Valukas (2010)<\u002Fspan><span class=\"pg\">14 / 16<\u002Fspan><\u002Fdiv>\n  <aside class=\"notes\" data-time=\"0:50 (total 9:30)\">Two points are contested. First, could the Fed save Lehman? Bernanke and Paulson say there was no legal power and not enough collateral. Laurence Ball says the power existed and the decision was political. We find Ball more convincing about the reason, because the Fed gave the Commission no written analysis of the collateral. Lee's motive does not change our facts. The numbers come from Lehman's own documents. Our main limit is the denominator. Goldman Sachs and Morgan Stanley survived. So our factors are necessary, but not sufficient.<\u002Faside>\n<\u002Fsection>\n\n<section class=\"slide dark\" id=\"s15\">\n  <div class=\"jpm jp\"><b>一五<\u002Fb>その後<\u002Fdiv>\n  <div class=\"eyebrow\">What changed after <span class=\"dt\">· 21 Sep 2008 – 2015<\u002Fspan><\u002Fdiv>\n  <div class=\"body\" style=\"display:flex;flex-direction:column;justify-content:space-between;margin-top:34px\">\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\">\n      <div data-b=\"1\" class=\"card\" style=\"display:flex;gap:20px;align-items:flex-start;padding:28px 28px\"><div class=\"ico\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9.5h18\"><\u002Fpath><path d=\"M12 3l9 5H3z\"><\u002Fpath><path d=\"M5.5 10v8M10 10v8M14 10v8M18.5 10v8\"><\u002Fpath><path d=\"M3 21h18\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div class=\"date acc\" style=\"font-size:32px\">21 Sep 2008<\u002Fdiv><p style=\"font-size:24px;margin-top:6px\">Goldman Sachs and Morgan Stanley become bank holding companies<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div data-b=\"2\" class=\"card\" style=\"display:flex;gap:20px;align-items:flex-start;padding:28px 28px\"><div class=\"ico\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5z\"><\u002Fpath><path d=\"M8 11V7.5a4 4 0 0 1 8 0V11\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div class=\"date acc\" style=\"font-size:32px\">26 Sep 2008<\u002Fdiv><p style=\"font-size:24px;margin-top:6px\">The SEC announces the end of its CSE programme<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div data-b=\"3\" class=\"card\" style=\"display:flex;gap:20px;align-items:flex-start;padding:28px 28px\"><div class=\"ico\" style=\"width:64px;height:64px;border-radius:20px\"><svg class=\"ic\" width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v16.5\"><\u002Fpath><path d=\"M8 21h8\"><\u002Fpath><path d=\"M4.5 7.5h15\"><\u002Fpath><path d=\"M4.5 7.5L2 14a3 3 0 0 0 5 0z\"><\u002Fpath><path d=\"M19.5 7.5L17 14a3 3 0 0 0 5 0z\"><\u002Fpath><circle cx=\"12\" cy=\"4\" r=\"1\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div class=\"date acc\" style=\"font-size:32px\">2013<\u002Fdiv><p style=\"font-size:24px;margin-top:6px\">E&amp;Y settlement<\u002Fp><p class=\"big\" style=\"font-size:48px;margin-top:6px\">$99 mn<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div data-b=\"3\" class=\"card\" style=\"display:flex;gap:20px;align-items:flex-start;padding:28px 28px\"><div class=\"ico\" style=
